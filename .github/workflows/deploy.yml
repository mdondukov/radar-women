name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy
        required: false
        default: main

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/radar-women
  SERVICE: radar-women
  SITE: https://radar-women.biom.kg

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CRA bakes REACT_APP_* in at build time, so the image is environment
      # specific: whatever .env sits in the build context wins. .dockerignore
      # keeps .env.local (a developer's localhost API) out of it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: env/dev/docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Pull the new image and recreate the service
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SERVICE: ${{ env.SERVICE }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            set -e
            cd /opt/docker/compose/biom_app
            docker compose pull $SERVICE
            docker compose up -d --force-recreate $SERVICE
            docker compose restart proxy
            docker image prune -f
          "

      - name: Smoke check
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE") || true
            [ "$code" = "200" ] && echo "$SITE: 200" && exit 0
            sleep 3
          done
          echo "site check failed (last code: $code)" >&2
          exit 1
